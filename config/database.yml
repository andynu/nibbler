# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  #
  # One file is loaded by two kinds of process, so the pool has to cover
  # whichever is larger: Puma's RAILS_MAX_THREADS in the `web` role, or
  # GoodJob's max_threads plus its 2 shared utility threads
  # (GoodJob::SharedExecutor::MAX_THREADS) in the `job` role. Undersizing the
  # job side shows up as GoodJob's "more thread(s) than ActiveRecord's
  # database connection pool size" warning and then as checkout timeouts.
  max_connections: <%= [ ENV.fetch("RAILS_MAX_THREADS", 5).to_i, ENV.fetch("GOOD_JOB_MAX_THREADS", 5).to_i + 2 ].max %>


development:
  <<: *default
  database: ttrb_development
  username: ttrb
  password: ttrb_dev
  host: localhost
  port: 5432

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # bin/e2e-server boots a real server in RAILS_ENV=test for the Playwright
  # suite and sets E2E_DATABASE_NAME=ttrb_e2e, so the E2E fixture set (which is
  # truncated and rebuilt between examples) never lands in the database the
  # Minitest suite owns. Nothing else sets the variable.
  database: <%= ENV.fetch("E2E_DATABASE_NAME", "ttrb_test") %>
  username: ttrb
  password: ttrb_dev
  host: localhost
  port: 5432

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  # Solid Cache lives in its own database ("<primary>_cache"), sharing the
  # primary's host and credentials unless CACHE_DATABASE_URL is set explicitly.
  #
  # Do NOT give this entry the primary's `url:` (e.g. by inheriting from an
  # anchor on primary). Rails merges a `url:` on top of the rest of the config
  # hash (ActiveRecord::DatabaseConfigurations::UrlConfig), so the URL's database
  # name silently overrides any `database:` key here and the cache resolves to
  # the primary database. db:prepare then finds schema_migrations already
  # present, skips loading db/cache_schema.rb, and solid_cache_entries is never
  # created -- every Rails.cache call raises PG::UndefinedTable at runtime.
  cache:
    <<: *default
    url: <%= ENV.fetch("CACHE_DATABASE_URL") { ENV["DATABASE_URL"] && URI.parse(ENV["DATABASE_URL"]).tap { |u| u.path += "_cache" }.to_s } %>
    migrations_paths: db/cache_migrate
