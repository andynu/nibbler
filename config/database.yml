# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  #
  # One file is loaded by two kinds of process, so the pool has to cover
  # whichever is larger: the `web` role, or GoodJob's max_threads plus its 2
  # shared utility threads (GoodJob::SharedExecutor::MAX_THREADS) in the `job`
  # role. Undersizing the job side shows up as GoodJob's "more thread(s) than
  # ActiveRecord's database connection pool size" warning and then as checkout
  # timeouts.
  #
  # The web role is Puma's RAILS_MAX_THREADS *plus* Action Cable's worker pool,
  # not just Puma's. Connection and channel callbacks do not run on the Puma
  # thread that served the upgrade: ActionCable::Connection::Base#send_async
  # hands them to ActionCable::Server::Worker's thread pool, and each of those
  # threads holds an Active Record connection for the duration of its work --
  # ApplicationCable::Connection#find_verified_user is a User lookup on every
  # socket. Sizing on RAILS_MAX_THREADS alone leaves the two pools competing for
  # one allocation, and the symptom is a websocket handshake timing out on
  # checkout under load while ordinary requests look fine.
  # config/application.rb sets worker_pool_size from the same variable.
  max_connections: <%= [ ENV.fetch("RAILS_MAX_THREADS", 5).to_i + ENV.fetch("ACTION_CABLE_WORKER_POOL_SIZE", 4).to_i, ENV.fetch("GOOD_JOB_MAX_THREADS", 5).to_i + 2 ].max %>


# Development is multi-database for the same reason production is: Action Cable
# runs the solid_cable adapter here too (config/cable.yml explains why it is not
# `async`), and solid_cable_messages belongs in its own database rather than
# alongside the application tables.
#
# The `url:` merge trap documented on the production `cache:` entry below does
# not apply here -- neither development entry has a `url:` key, so the anchor
# can be inherited wholesale and `database:` is the only thing that decides
# which database is reached.
#
# Having a `cable:` entry here is also why db/cable_schema.rb is dumper output
# rather than the copy of solid_cable's generator template it started as.
# `bin/rails db:migrate` ends in db:_dump, which dumps *every* database in the
# current environment, so any migration at all -- including ones that have
# nothing to do with cable -- rewrote the hand-written file and left the churn
# in `git status` next to the migration someone was actually working on. The
# two forms are the same database on PostgreSQL: `t.binary limit:` is ignored
# (bytea has no length) and `t.integer limit: 8` is spelled `t.bigint`, so both
# load to an identical catalog and both dump back out as the committed form.
# Do not "restore" the template shape; it is not a fixed point and db:migrate
# will simply undo it.
#
# `schema_dump: false` is NOT the fix. It nils the path that
# ActiveRecord::Tasks::DatabaseTasks uses for loading as well as dumping, and
# db/cable_migrate is empty, so a fresh `bin/setup` would create the cable
# database and never create solid_cable_messages -- the silent-at-broadcast
# failure this split was set up to avoid.
#
# db/cache_schema.rb is still in template shape only because no environment
# outside production configures a cache database (development is
# :memory_store, test is :null_store, and production sets
# dump_schema_after_migration = false). Add a `cache:` entry here and it picks
# up the same behaviour; let it be dumped rather than fighting it.
development:
  primary: &development_primary
    <<: *default
    database: ttrb_development
    username: ttrb
    password: ttrb_dev
    host: localhost
    port: 5432

  cable:
    <<: *development_primary
    database: ttrb_development_cable
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # bin/e2e-server boots a real server in RAILS_ENV=test for the Playwright
  # suite and sets E2E_DATABASE_NAME=ttrb_e2e, so the E2E fixture set (which is
  # truncated and rebuilt between examples) never lands in the database the
  # Minitest suite owns. Nothing else sets the variable.
  database: <%= ENV.fetch("E2E_DATABASE_NAME", "ttrb_test") %>
  username: ttrb
  password: ttrb_dev
  host: localhost
  port: 5432

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  # Solid Cache lives in its own database ("<primary>_cache"), sharing the
  # primary's host and credentials unless CACHE_DATABASE_URL is set explicitly.
  #
  # Do NOT give this entry the primary's `url:` (e.g. by inheriting from an
  # anchor on primary). Rails merges a `url:` on top of the rest of the config
  # hash (ActiveRecord::DatabaseConfigurations::UrlConfig), so the URL's database
  # name silently overrides any `database:` key here and the cache resolves to
  # the primary database. db:prepare then finds schema_migrations already
  # present, skips loading db/cache_schema.rb, and solid_cache_entries is never
  # created -- every Rails.cache call raises PG::UndefinedTable at runtime.
  cache:
    <<: *default
    url: <%= ENV.fetch("CACHE_DATABASE_URL") { ENV["DATABASE_URL"] && URI.parse(ENV["DATABASE_URL"]).tap { |u| u.path += "_cache" }.to_s } %>
    migrations_paths: db/cache_migrate

  # Solid Cable derives its database the same way, for the same reason: the
  # `url:` here must be its own or the URL's database name overrides
  # `database:` and the cable tables are never created. The failure differs from
  # the cache one only in being quieter -- nothing raises on a page load,
  # subscribing and broadcasting just stop working.
  cable:
    <<: *default
    url: <%= ENV.fetch("CABLE_DATABASE_URL") { ENV["DATABASE_URL"] && URI.parse(ENV["DATABASE_URL"]).tap { |u| u.path += "_cable" }.to_s } %>
    migrations_paths: db/cable_migrate
