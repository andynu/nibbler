name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      # Runs even when Brakeman fails. These two scans answer unrelated
      # questions -- our own code versus published advisories against our gems
      # -- so letting the first failure skip the second hides gem CVEs behind an
      # unrelated Brakeman warning. That happened: Brakeman was red on main from
      # 2026-08-18, and no gem advisory was checked for the whole of that time.
      # The job still fails if either step does.
      - name: Scan for known security vulnerabilities in gems used
        if: ${{ !cancelled() }}
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # eslint.config.mjs enables react-hooks only. rules-of-hooks is an error,
      # exhaustive-deps a warning, so this step fails on a conditionally-called
      # hook and stays green on the pre-existing dependency-array backlog.
      - name: Lint JavaScript for React hook rules
        run: npm run lint:js

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the production database in config/deploy.yml.
        image: postgres:17
        # Credentials and database name must match the `test:` section of
        # config/database.yml, which the test run reads directly.
        env:
          POSTGRES_USER: ttrb
          POSTGRES_PASSWORD: ttrb_dev
          POSTGRES_DB: ttrb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttrb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # jsbundling-rails and cssbundling-rails hook javascript:build and
      # css:build into test:prepare, so the Ruby suite needs Node available.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Ruby tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  test_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run component tests
        run: npm run test:run

  test_e2e:
    runs-on: ubuntu-latest

    # One shard per Playwright project. Every spec runs in both engines and the
    # suite is workers: 1 against a single database, so in one job the second
    # engine was pure wall-clock on what is already the longest job here.
    # Measured on one machine at 413 examples per project: chromium 372s,
    # firefox 484s, against 856s for the two in series. Firefox sets the job's
    # duration now, so the step goes from about 14 minutes to about 8.
    #
    # Each shard brings its own postgres service and its own bin/e2e-server, so
    # they do not contend. What genuinely doubles is the scaffolding -- an
    # extra checkout, bundle install, npm ci, apt for --with-deps, and postgres
    # image pull. The browser payload does not: each shard installs only its
    # own engine, so the bytes split rather than repeat. This repository is
    # public, so the extra runner-minutes are free on the standard runners.
    strategy:
      # A failure in one engine must not cancel the other. Which engines fail
      # is the whole signal a two-engine suite exists to produce -- Firefox-only
      # is a portability defect, both is an application defect -- and cancelling
      # the sibling shard throws that away exactly when it is wanted.
      fail-fast: false
      matrix:
        project: [chromium, firefox]

    services:
      postgres:
        image: postgres:17
        # bin/e2e-server creates ttrb_e2e itself; these credentials are the ones
        # the `test:` section of config/database.yml reads.
        env:
          POSTGRES_USER: ttrb
          POSTGRES_PASSWORD: ttrb_dev
          POSTGRES_DB: ttrb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttrb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Only this shard's engine, which is what keeps the browser download
      # split between the two runners instead of paid twice on each.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      # playwright.config.ts starts bin/e2e-server, which builds assets,
      # creates and seeds ttrb_e2e, and boots the server with feed fetching
      # stubbed out. Nothing here reaches the public internet.
      - name: Run end-to-end tests
        run: npx playwright test --project=${{ matrix.project }}

      # Named per shard. Two shards uploading `playwright-results` collide, and
      # actions/upload-artifact@v4 and up rejects the second one outright
      # rather than merging it, so the losing engine's traces are the ones you
      # would not have.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

