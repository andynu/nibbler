name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # eslint.config.mjs enables react-hooks only. rules-of-hooks is an error,
      # exhaustive-deps a warning, so this step fails on a conditionally-called
      # hook and stays green on the pre-existing dependency-array backlog.
      - name: Lint JavaScript for React hook rules
        run: npm run lint:js

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the production database in config/deploy.yml.
        image: postgres:17
        # Credentials and database name must match the `test:` section of
        # config/database.yml, which the test run reads directly.
        env:
          POSTGRES_USER: ttrb
          POSTGRES_PASSWORD: ttrb_dev
          POSTGRES_DB: ttrb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttrb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # jsbundling-rails and cssbundling-rails hook javascript:build and
      # css:build into test:prepare, so the Ruby suite needs Node available.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Ruby tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  test_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run component tests
        run: npm run test:run

  test_e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        # bin/e2e-server creates ttrb_e2e itself; these credentials are the ones
        # the `test:` section of config/database.yml reads.
        env:
          POSTGRES_USER: ttrb
          POSTGRES_PASSWORD: ttrb_dev
          POSTGRES_DB: ttrb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttrb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Both browsers playwright.config.ts declares a project for. Firefox runs
      # only the three browse-mode specs, so the extra download is cheap; drop
      # it and every test in that project errors with a missing executable.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # playwright.config.ts starts bin/e2e-server, which builds assets,
      # creates and seeds ttrb_e2e, and boots the server with feed fetching
      # stubbed out. Nothing here reaches the public internet.
      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

