name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the production database in config/deploy.yml.
        image: postgres:17
        # Credentials and database name must match the `test:` section of
        # config/database.yml, which the test run reads directly.
        env:
          POSTGRES_USER: ttrb
          POSTGRES_PASSWORD: ttrb_dev
          POSTGRES_DB: ttrb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttrb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # jsbundling-rails and cssbundling-rails hook javascript:build and
      # css:build into test:prepare, so the Ruby suite needs Node available.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Ruby tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  test_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:run

  # Playwright end-to-end tests (npm run test:e2e) are deliberately NOT run on
  # pull requests. They are written to drive a `bin/rails server` instance
  # against a populated developer database, which makes them unfit for PR CI
  # as they stand today:
  #
  #   - They read and mutate live data (mark all read, star/unstar, create and
  #     delete labels and categories). A clean CI database makes roughly half of
  #     the 213 specs no-op via their `test.skip` data guards, so a green run
  #     would not mean much.
  #   - e2e/smoke.spec.ts drives the refresh button, which fetches real feed
  #     URLs over the public internet. That is a flaky and slow dependency to
  #     put in front of every merge.
  #   - Auto-authentication relies on ALLOW_DEV_AUTH=1 plus a pre-existing user;
  #     db/seeds.rb creates the admin user but no feeds or entries.
  #
  # Making the suite hermetic (fixture-seeded database, no external network)
  # is tracked separately; add the job here once that work lands. Until then
  # run them locally with `npm run test:e2e`.

